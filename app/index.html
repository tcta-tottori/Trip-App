<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a5f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Disney2026">
<title>ディズニー旅行 2026</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon.svg">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="app">

  <!-- Home -->
  <section class="screen" id="screen-home" data-screen="home">
    <header class="topbar">
      <h1>🏰 Disney 2026</h1>
      <button class="icon-btn" data-action="settings" aria-label="設定">⚙️</button>
    </header>
    <div class="content" id="home-content"></div>
  </section>

  <!-- Itinerary -->
  <section class="screen" id="screen-itinerary" data-screen="itinerary" hidden>
    <header class="topbar"><h1>📅 旅程</h1></header>
    <div class="day-tabs" id="day-tabs"></div>
    <div class="content" id="itinerary-content"></div>
  </section>

  <!-- Attractions -->
  <section class="screen" id="screen-attractions" data-screen="attractions" hidden>
    <header class="topbar"><h1>🎢 アトラクション</h1></header>
    <div class="park-tabs">
      <button class="park-tab active" data-park="land">🏰 ランド</button>
      <button class="park-tab" data-park="sea">🌊 シー</button>
    </div>
    <div class="filters" id="attraction-filters">
      <label class="chip"><input type="checkbox" id="f-safe" checked> 安心のみ（〜Lv2）</label>
      <label class="chip"><input type="checkbox" id="f-fav"> ⭐ お気に入り</label>
      <label class="chip"><input type="checkbox" id="f-unrid"> 未体験</label>
      <label class="chip"><input type="checkbox" id="f-open" checked> 営業中のみ</label>
    </div>
    <div class="content" id="attractions-content"></div>
  </section>

  <!-- Map -->
  <section class="screen" id="screen-map" data-screen="map" hidden>
    <header class="topbar"><h1>🗺️ 地図</h1></header>
    <div class="map-tabs">
      <button class="map-tab active" data-mapview="land">ランド</button>
      <button class="map-tab" data-mapview="sea">シー</button>
      <button class="map-tab" data-mapview="urayasu">浦安エリア</button>
    </div>
    <div id="map"></div>
    <div class="map-actions">
      <button class="btn small" data-action="locate">📍 現在地</button>
      <button class="btn small" data-action="fit">全表示</button>
    </div>
  </section>

  <!-- Checklist -->
  <section class="screen" id="screen-checklist" data-screen="checklist" hidden>
    <header class="topbar"><h1>✅ 持ち物</h1></header>
    <div class="content" id="checklist-content"></div>
  </section>

  <!-- Emergency -->
  <section class="screen" id="screen-emergency" data-screen="emergency" hidden>
    <header class="topbar"><h1>🆘 緊急情報</h1></header>
    <div class="content" id="emergency-content"></div>
  </section>

  <!-- Memos -->
  <section class="screen" id="screen-memos" data-screen="memos" hidden>
    <header class="topbar"><h1>📝 メモ</h1></header>
    <div class="content" id="memos-content"></div>
  </section>

  <!-- Settings -->
  <section class="screen" id="screen-settings" data-screen="settings" hidden>
    <header class="topbar"><h1>⚙️ 設定</h1></header>
    <div class="content" id="settings-content"></div>
  </section>

</div>

<!-- Detail modal -->
<div class="modal" id="modal" hidden>
  <div class="modal-bg" data-close></div>
  <div class="modal-card">
    <button class="modal-close" data-close>✕</button>
    <div class="modal-content" id="modal-content"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast" hidden></div>

<!-- Bottom nav -->
<nav class="tabbar" role="navigation">
  <button class="tab active" data-go="home"><span>🏠</span><label>ホーム</label></button>
  <button class="tab" data-go="itinerary"><span>📅</span><label>旅程</label></button>
  <button class="tab" data-go="attractions"><span>🎢</span><label>乗物</label></button>
  <button class="tab" data-go="map"><span>🗺️</span><label>地図</label></button>
  <button class="tab" data-go="checklist"><span>✅</span><label>持物</label></button>
  <button class="tab" data-go="more"><span>⋯</span><label>その他</label></button>
</nav>

<!-- More menu -->
<div class="more-menu" id="more-menu" hidden>
  <button data-go="emergency">🆘 緊急情報</button>
  <button data-go="memos">📝 メモ</button>
  <button data-go="settings">⚙️ 設定</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/timer.js"></script>
<script src="js/checklist.js"></script>
<script src="js/map.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
