name: Fetch attraction images and URLs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Commit images and URLs to this branch"
        required: false
        default: "claude/new-session-BlJ72"
      source:
        description: "Image source: official (OGP), wikipedia, or both"
        required: false
        default: "both"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Fetch official URLs
        run: python3 scripts/fetch_official_urls.py

      - name: Fetch official OGP images
        if: ${{ github.event.inputs.source != 'wikipedia' }}
        run: python3 scripts/fetch_official_images.py

      - name: Fetch Wikipedia images (fallback / fill missing)
        if: ${{ github.event.inputs.source != 'official' }}
        env:
          # When running after the OGP fetcher, keep its results in place
          # and only fill in attractions that still have no image.
          SKIP_EXISTING: ${{ github.event.inputs.source == 'wikipedia' && '0' || '1' }}
        run: python3 scripts/fetch_images.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/attractions.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh attraction images and official URLs"
          git push origin HEAD:${{ github.event.inputs.branch }}
