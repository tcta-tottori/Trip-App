name: Fetch attraction images and URLs

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Commit images and URLs to this branch"
        required: false
        default: "claude/mobile-shareable-url-1gj8c"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Fetch images
        run: python3 scripts/fetch_images.py

      - name: Fetch official URLs
        run: python3 scripts/fetch_official_urls.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/attractions.json
          if git diff --staged --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Refresh attraction images and official URLs"
          git push origin HEAD:${{ github.event.inputs.branch }}
