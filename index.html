<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Disney Trip 2026</title>
<style>
  body {
    font-family: -apple-system, system-ui, sans-serif;
    background: linear-gradient(135deg, #0d3c5a 0%, #1d6b8a 50%, #3eaecf 100%);
    color: #f5fcff;
    min-height: 100vh; margin: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .wrap { max-width: 480px; text-align: center; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  .eyebrow { letter-spacing: 0.2em; color: #b5e3f0; font-size: 12px; margin-bottom: 12px; }
  p { opacity: 0.92; margin-bottom: 28px; line-height: 1.6; }
  .links { display: grid; gap: 12px; }
  a {
    display: block;
    background: rgba(255,255,255,0.12);
    border: 1px solid rgba(180,230,245,0.35);
    color: #f5fcff;
    padding: 18px 24px;
    border-radius: 12px;
    text-decoration: none;
    font-size: 16px;
    transition: 0.2s;
  }
  a:hover { background: rgba(255,255,255,0.2); }
  a strong { display: block; color: #b5e3f0; font-size: 18px; margin-bottom: 4px; }
  a small { opacity: 0.8; font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="eyebrow">FAMILY TRIP · 2026</div>
  <h1>東京ディズニーリゾート<br>2泊3日の旅</h1>
  <p>2026年6月6日（土）〜 8日（月）</p>
  <div class="links">
    <a href="docs/"><strong>📋 旅程資料</strong><small>事前確認用・印刷可能</small></a>
    <a href="app/"><strong>📱 旅行アプリ</strong><small>当日用 PWA・スマホで使う</small></a>
  </div>
</div>
</body>
</html>
